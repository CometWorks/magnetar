name: Upload MagnetarMod to Steam Workshop

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      login_only:
        description: "Verify Steam login without publishing"
        type: boolean
        default: false
      changenote:
        description: "Steam Workshop change note"
        required: false
        default: "Manual GitHub Actions upload"
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build upload content
        if: ${{ !inputs.login_only }}
        run: |
          set -euo pipefail

          STAGING="${RUNNER_TEMP}/MagnetarMod-upload"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          rsync -a --delete MagnetarMod/src/ "$STAGING/"

          SBMI_FILE="$STAGING/modinfo.sbmi"
          if [ ! -f "$SBMI_FILE" ]; then
            echo "Expected metadata file not found: $SBMI_FILE"
            exit 1
          fi

          THUMBNAIL_FILE="$STAGING/thumb.png"
          if [ ! -f "$THUMBNAIL_FILE" ]; then
            echo "Expected Workshop thumbnail not found: $THUMBNAIL_FILE"
            exit 1
          fi

          WORKSHOP_ID="$(SBMI_FILE="$SBMI_FILE" python3 -c 'import xml.etree.ElementTree as ET, os; root = ET.parse(os.environ["SBMI_FILE"]).getroot(); ids = root.findall(".//WorkshopIds/WorkshopId/Id"); print(((ids[0].text or "").strip()) if ids else "")')"

          if ! printf '%s' "$WORKSHOP_ID" | grep -Eq '^[1-9][0-9]*$'; then
            echo "Unable to resolve a valid Workshop ID from $SBMI_FILE"
            exit 1
          fi

          echo "WORKSHOP_ID=$WORKSHOP_ID" >> "$GITHUB_ENV"
          echo "STAGING_DIR=$STAGING" >> "$GITHUB_ENV"
          echo "PREVIEW_FILE=$THUMBNAIL_FILE" >> "$GITHUB_ENV"
          echo "Prepared MagnetarMod upload staging at $STAGING with Workshop ID $WORKSHOP_ID"

      - name: Setup SteamCMD
        uses: andriivitiv/setup-steamcmd@v1.2.0

      - name: Create SteamCMD upload script
        if: ${{ !inputs.login_only }}
        env:
          CHANGE_NOTE: ${{ github.event.inputs.changenote }}
        run: |
          set -euo pipefail

          {
            SAFE_CHANGE_NOTE="${CHANGE_NOTE//$'\n'/ }"
            SAFE_CHANGE_NOTE="${SAFE_CHANGE_NOTE//\"/\'}"

            echo '"workshopitem"'
            echo '{'
            echo '  "appid" "244850"'
            echo "  \"publishedfileid\" \"${WORKSHOP_ID}\""
            echo "  \"contentfolder\" \"${STAGING_DIR}\""
            echo "  \"previewfile\" \"${PREVIEW_FILE}\""
            echo "  \"changenote\" \"${SAFE_CHANGE_NOTE}\""
            echo '}'
          } > "$RUNNER_TEMP/workshop_item.vdf"

      - name: Install SteamCMD cached credentials config
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        shell: python
        run: |
          import base64
          import binascii
          import os
          import re
          from pathlib import Path

          username = os.environ["STEAM_USERNAME"]
          config = os.environ["STEAM_CONFIG_VDF"]
          if not username.strip() or username != username.strip():
              raise SystemExit("Check STEAM_USERNAME for a missing value or surrounding whitespace.")
          if not config.lstrip().startswith('"'):
              try:
                  decoded = base64.b64decode("".join(config.split()), validate=True).decode()
              except (binascii.Error, UnicodeError, ValueError):
                  decoded = ""
              if '"InstallConfigStore"' in decoded:
                  print("Decoded base64 SteamCMD config.")
                  config = decoded
              else:
                  raise SystemExit("STEAM_CONFIG_VDF contains neither raw VDF text nor its base64 encoding.")
          accounts = re.search(r'"Accounts"\s*\{\s*"([^"]+)"\s*\{', config, re.I)
          if not accounts:
              raise SystemExit("STEAM_CONFIG_VDF must contain the raw SteamCMD config.vdf with a saved account.")
          if not re.search(r'"' + re.escape(username) + r'"\s*\{', config, re.I):
              raise SystemExit("STEAM_USERNAME does not match a saved account in STEAM_CONFIG_VDF.")
          if not re.search(r'"ConnectCache"\s*\{\s*"[^"]+"\s*"[^"]+"', config, re.I):
              raise SystemExit("STEAM_CONFIG_VDF has no cached Steam login.")

          os.umask(0o077)
          path = Path.home() / "Steam/config/config.vdf"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(config)
          print("Installed SteamCMD config with a matching saved account and credential cache.")

      - name: Run SteamCMD
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          LOGIN_ONLY: ${{ inputs.login_only }}
        run: |
          set -euo pipefail
          args=(+@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 +login "$STEAM_USERNAME")
          if [[ "$LOGIN_ONLY" != true ]]; then
            args+=(+workshop_build_item "$RUNNER_TEMP/workshop_item.vdf")
          fi
          steamcmd "${args[@]}" +quit
